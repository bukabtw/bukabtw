name: Generate Stats

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}

      - name: Generate stats card (левая колонка)
        uses: lowlighter/metrics@3.34.0
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bukabtw
          template: classic
          base: header, activity, community
          filename: assets/stats.svg
          config_output: svg

      - name: Generate languages card (правая колонка)
        uses: lowlighter/metrics@3.34.0
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bukabtw
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 6
          filename: assets/languages.svg
          config_output: svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet || git commit -m "📊 Update stats"
          git push
