name: Generate Stats

on:
  schedule:
    - cron: "0 6 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: bukabtw
          template: classic
          base: header
          plugin_languages: yes
          plugin_languages_section: most-used
          plugin_languages_details: bytes-size, percentage
          output_action: none
          filename: github-metrics.svg
          config_output: svg

      - name: Commit image to repo
        run: |
          mkdir -p assets
          mv github-metrics.svg assets/github-metrics.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-metrics.svg
          git diff --staged --quiet || git commit -m "📊 Update metrics"
          git push
